<!doctype html>
<!--
  popup/popup.html — fenêtre affichée au clic sur l'icône de l'extension
  (déclarée dans « action.default_popup » du manifest).

  Structure : en-tête (logo + nom), interrupteur général, indicateur d'état de l'onglet
  actif, compteurs, liens d'action. Le comportement est dans popup.js, l'apparence dans
  popup.css. Les règles de sécurité des extensions (CSP) interdisent le JavaScript écrit
  directement dans le HTML : tout le code est dans des fichiers .js séparés.
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Ad Skip</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- En-tête : logo et nom de l'extension. alt="" car l'image est décorative (le nom suit). -->
  <header class="header">
    <img src="../assets/icons/icon-48.png" alt="" width="32" height="32">
    <h1>YouTube Ad Skip</h1>
  </header>

  <!--
    Interrupteur général. C'est une vraie case à cocher (accessible au clavier et aux
    lecteurs d'écran, role="switch"), masquée visuellement et remplacée par .switch.
    Tout le <label> est cliquable.
  -->
  <label class="toggle">
    <span class="toggle-text">
      <span class="toggle-title">Ignorer les publicités</span>
      <span class="toggle-hint">Clic automatique sur « Ignorer »</span>
    </span>
    <input type="checkbox" id="enabled" role="switch">
    <span class="switch" aria-hidden="true"></span>
  </label>

  <!--
    Indicateur d'état de l'onglet actif. data-tone (ok / warn / muted) choisit la couleur
    de la pastille ; aria-live annonce les changements aux lecteurs d'écran.
  -->
  <p class="status" id="status" data-tone="muted" aria-live="polite">
    <span class="dot" aria-hidden="true"></span>
    <span id="status-text">Vérification…</span>
  </p>

  <!-- Compteurs de publicités réellement ignorées, mis à jour en direct par popup.js. -->
  <section class="stats" aria-label="Publicités ignorées">
    <div class="stat">
      <span class="stat-value" id="session-count">0</span>
      <span class="stat-label">cette session</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="total-count">0</span>
      <span class="stat-label">au total</span>
    </div>
  </section>

  <!-- Actions. L'aide s'ouvre dans un nouvel onglet (target="_blank"). -->
  <footer class="footer">
    <button type="button" class="link-button" id="reset">Réinitialiser les statistiques</button>
    <button type="button" class="link-button" id="open-options">Paramètres</button>
    <a href="../help/help.html" target="_blank" rel="noopener">Aide et informations</a>
  </footer>

  <!-- settings.js d'abord : popup.js utilise l'objet YtAdSkipSettings qu'il définit. -->
  <script src="../common/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
